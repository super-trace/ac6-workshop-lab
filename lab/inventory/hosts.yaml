---
# AC6 workshop devices as a Nornir inventory. stcli doesn't read it
# (it has no inventory flag); `stcli <device>` and `/add <device>` dial
# through the matching SSH aliases in lab/ssh_config.
#
# Host names match those aliases. hostname/port/username below are only used
# where the alias is not installed.
nokia:
  port: 2401
  groups: [nokia_srlinux]
  data:
    role: blank
arista:
  port: 2402
  groups: [arista_ceos]
  data:
    role: configured
