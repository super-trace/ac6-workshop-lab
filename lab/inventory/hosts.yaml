---
# AC6 workshop devices for `stcli -i lab/inventory/hosts.yaml`.
#
# Host names match the SSH aliases in lab/ssh_config, so stcli dials each
# device through that alias (port, user, key). hostname/port/username below
# are only used where the alias is not installed.
sw-jfk:
  port: 2401
  groups: [jfk, nokia_srlinux]
  data:
    role: switch
client-jfk:
  port: 2402
  username: root
  groups: [jfk, linux]
  data:
    role: client
sw-iad:
  port: 2403
  groups: [iad, arista_ceos]
  data:
    role: switch
client-iad:
  port: 2404
  username: root
  groups: [iad, linux]
  data:
    role: client
rtr-phl:
  port: 2405
  groups: [wan, arista_ceos]
rtr-ewr:
  port: 2406
  groups: [wan, nokia_srlinux]
