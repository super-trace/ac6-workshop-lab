set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 203.0.113.0/31

set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.1.1.0/31

set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.0.1/32

set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface system0.0

set / network-instance default protocols ospf instance main version ospf-v2
set / network-instance default protocols ospf instance main admin-state enable
set / network-instance default protocols ospf instance main router-id 10.0.0.1
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/2.0 admin-state enable
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/2.0 interface-type point-to-point
set / network-instance default protocols ospf instance main area 0.0.0.0 interface system0.0 admin-state enable
set / network-instance default protocols ospf instance main area 0.0.0.0 interface system0.0 passive true

set / network-instance default protocols bgp autonomous-system 65010
set / network-instance default protocols bgp router-id 10.0.0.1
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable

# Explicit allow-list, not a broad "match protocol ospfv2": this is exactly
# what the BGP scenario breaks (`scripts/break-bgp.sh` removes the
# 192.168.100.0/24 entry below) and fixes (re-adds it) with a single set/
# delete line each — no statement-ordering ambiguity to worry about.
set / routing-policy prefix-set advertised prefix 10.0.0.2/32 mask-length-range exact
set / routing-policy prefix-set advertised prefix 192.168.100.0/24 mask-length-range exact
set / routing-policy policy advertise-customer statement 10 match prefix prefix-set advertised
set / routing-policy policy advertise-customer statement 10 action policy-result accept

set / network-instance default protocols bgp group upstream peer-as 65020
set / network-instance default protocols bgp group upstream admin-state enable
set / network-instance default protocols bgp group upstream afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group upstream export-policy ["advertise-customer"]
set / network-instance default protocols bgp neighbor 203.0.113.1 peer-group upstream
set / network-instance default protocols bgp group upstream next-hop-self true
