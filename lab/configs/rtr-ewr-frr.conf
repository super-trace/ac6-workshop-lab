frr version 8.4_git
frr defaults traditional
hostname rtr-ewr
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.20.0.2/32
!
interface eth1
 ip address 172.16.2.1/31
!
interface eth2
 ip address 172.16.4.1/31
!
interface eth3
 ip address 172.16.5.1/31
!
router bgp 65022
 bgp router-id 10.20.0.2
 no bgp ebgp-requires-policy
 neighbor 172.16.2.0 remote-as 65010
 neighbor 172.16.2.0 timers connect 5
 neighbor 172.16.4.0 remote-as 65030
 neighbor 172.16.4.0 timers connect 5
 neighbor 172.16.5.0 remote-as 65021
 neighbor 172.16.5.0 timers connect 5
 !
 address-family ipv4 unicast
  neighbor 172.16.2.0 activate
  neighbor 172.16.4.0 activate
  neighbor 172.16.5.0 activate
 exit-address-family
!
line vty
!
end
