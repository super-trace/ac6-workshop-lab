hostname leaf-iad
!
! Shared disposable-lab account.
username stcli privilege 15 role network-admin secret admin
username stcli ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+
aaa authorization exec default local
!
management api http-commands
   no shutdown
!
management ssh
   no shutdown
!
ip routing
!
interface Loopback0
   ip address 10.30.0.11/32
   ip ospf area 0.0.0.0
!
interface Ethernet1
   no switchport
   mtu 1500
   ip address 10.30.1.1/31
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
!
interface Ethernet2
   no switchport
   mtu 1500
   ip address 192.168.31.1/24
   ip ospf area 0.0.0.0
!
router ospf 1
   router-id 10.30.0.11
   passive-interface default
   no passive-interface Ethernet1
!
router bgp 65030
   router-id 10.30.0.11
   neighbor 10.30.0.1 remote-as 65030
   neighbor 10.30.0.1 update-source Loopback0
   address-family ipv4
      neighbor 10.30.0.1 activate
!
end
