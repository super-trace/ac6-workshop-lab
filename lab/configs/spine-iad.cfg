# spine-iad — IAD site's only spine, mirrors spine-jfk. OSPF to the IAD
# leaf, eBGP to both WAN routers. AS 65030.

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.30.1.0/31

set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 172.16.3.0/31

set / interface ethernet-1/4 admin-state enable
set / interface ethernet-1/4 subinterface 0 admin-state enable
set / interface ethernet-1/4 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/4 subinterface 0 ipv4 address 172.16.4.0/31

set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.30.0.1/32

set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface ethernet-1/4.0
set / network-instance default interface system0.0

set / network-instance default protocols ospf instance main version ospf-v2
set / network-instance default protocols ospf instance main admin-state enable
set / network-instance default protocols ospf instance main router-id 10.30.0.1
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/1.0 admin-state enable
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point
set / network-instance default protocols ospf instance main area 0.0.0.0 interface system0.0 admin-state enable
set / network-instance default protocols ospf instance main area 0.0.0.0 interface system0.0 passive true

set / network-instance default protocols bgp autonomous-system 65030
set / network-instance default protocols bgp router-id 10.30.0.1
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable

set / routing-policy prefix-set advertised prefix 10.30.0.11/32 mask-length-range exact
set / routing-policy prefix-set advertised prefix 192.168.31.0/24 mask-length-range exact
set / routing-policy policy advertise-site statement 10 match prefix prefix-set advertised
set / routing-policy policy advertise-site statement 10 action policy-result accept

# SR Linux rejects every received eBGP route by default unless an
# import-policy says otherwise — see spine-jfk.cfg for how this was found.
set / routing-policy policy accept-all default-action policy-result accept

set / network-instance default protocols bgp group wan admin-state enable
set / network-instance default protocols bgp group wan afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group wan export-policy ["advertise-site"]
set / network-instance default protocols bgp group wan import-policy ["accept-all"]
set / network-instance default protocols bgp group wan next-hop-self true
# See spine-jfk.cfg: shortens the 120s default connect-retry so a
# break/fix cycle reconverges in seconds, not minutes.
set / network-instance default protocols bgp group wan timers connect-retry 5
set / network-instance default protocols bgp neighbor 172.16.3.1 peer-group wan
set / network-instance default protocols bgp neighbor 172.16.3.1 peer-as 65021
set / network-instance default protocols bgp neighbor 172.16.4.1 peer-group wan
set / network-instance default protocols bgp neighbor 172.16.4.1 peer-as 65022

# iBGP to leaf-iad — see spine-jfk.cfg for why this is loopback-to-loopback
# over the OSPF underlay, and why next-hop-self is required rather than a
# nice-to-have.
set / network-instance default protocols bgp group site-ibgp admin-state enable
set / network-instance default protocols bgp group site-ibgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group site-ibgp import-policy ["accept-all"]
set / network-instance default protocols bgp group site-ibgp export-policy ["accept-all"]
set / network-instance default protocols bgp group site-ibgp next-hop-self true
set / network-instance default protocols bgp group site-ibgp transport local-address 10.30.0.1
set / network-instance default protocols bgp neighbor 10.30.0.11 peer-group site-ibgp
set / network-instance default protocols bgp neighbor 10.30.0.11 peer-as 65030

# See spine-jfk.cfg for why this is a separate user rather than admin.
set / system aaa authentication user stcli password NokiaSrl1!
set / system aaa authentication user stcli superuser true
set / system aaa authentication user stcli ssh-key ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+ ac6-workshop-lab (shared, lab-only key, not a secret)"]
