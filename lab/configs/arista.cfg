! arista — intentionally blank: only what stcli needs to log in.
! Ethernet1 (BGP link to nokia) and Ethernet2 (trunk to nokia) are left at
! factory defaults; the workshop configures both.
hostname arista
!
! Shared disposable-lab account.
username stcli privilege 15 role network-admin secret admin
username stcli ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+
aaa authorization exec default local
!
management ssh
   no shutdown
!
end
