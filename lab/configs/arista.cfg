! arista — the configured side of the lab. AS 65001.
!   Ethernet1: routed link to the peer, eBGP to AS 65002
!   Ethernet2: 802.1Q trunk to the peer, VLANs 110/120/130, each with an
!              SVI gateway
! Nothing below names the peer's vendor or its port names: the workshop has
! the agent generate EOS config first, then convert it, so the config must
! not give the peer away as Nokia. LLDP is off for the same reason.
! nokia starts blank, so the BGP session sits in Active and the trunk has
! nobody tagging frames until the workshop configures that side.
hostname arista
!
! Shared disposable-lab account.
username stcli privilege 15 role network-admin secret admin
username stcli ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+
aaa authorization exec default local
!
no lldp run
!
vlan 110
   name DATA
!
vlan 120
   name VOICE
!
vlan 130
   name CAMERAS
!
interface Ethernet1
   description BGP: eBGP peer AS65002
   no switchport
   ip address 10.0.0.0/31
!
interface Ethernet2
   description TRUNK: to peer switch
   switchport mode trunk
   switchport trunk allowed vlan 110,120,130
!
interface Loopback0
   description LOOPBACK: router-id 10.255.0.1
   ip address 10.255.0.1/32
!
! A stand-in for a site LAN, so there is a real prefix to advertise.
interface Loopback1
   description LAN: simulated site subnet
   ip address 172.16.10.1/24
!
interface Vlan110
   description VLAN 110 DATA gateway
   ip address 10.110.0.1/24
!
interface Vlan120
   description VLAN 120 VOICE gateway
   ip address 10.120.0.1/24
!
interface Vlan130
   description VLAN 130 CAMERAS gateway
   ip address 10.130.0.1/24
!
ip routing
!
router bgp 65001
   router-id 10.255.0.1
   neighbor PEER peer group
   neighbor PEER remote-as 65002
   neighbor PEER description eBGP peer AS65002
   neighbor 10.0.0.1 peer group PEER
   neighbor 10.0.0.1 description eBGP peer
   network 10.255.0.1/32
   network 172.16.10.0/24
!
management ssh
   no shutdown
!
end
