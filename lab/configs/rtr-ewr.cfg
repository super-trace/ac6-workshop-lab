# rtr-ewr — SR Linux WAN transit router, AS 65022.

set / interface ethernet-1/1 description "WAN: spine-jfk e1-4 [eBGP AS65010]"
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 mtu 1514
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 172.16.2.1/31
set / network-instance default interface ethernet-1/1.0

set / interface ethernet-1/2 description "WAN: spine-iad Et4 [eBGP AS65030]"
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 mtu 1514
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 172.16.4.1/31
set / network-instance default interface ethernet-1/2.0

set / interface ethernet-1/3 description "WAN: rtr-phl Et3 [eBGP AS65021]"
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 mtu 1514
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 172.16.5.1/31
set / network-instance default interface ethernet-1/3.0

set / interface system0 description "LOOPBACK: router-id 10.20.0.2"
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.20.0.2/32
set / network-instance default interface system0.0

set / routing-policy policy accept-all default-action policy-result accept
set / routing-policy policy transit-bgp statement 10 match protocol bgp
set / routing-policy policy transit-bgp statement 10 action policy-result accept
set / network-instance default protocols bgp autonomous-system 65022
set / network-instance default protocols bgp router-id 10.20.0.2
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group wan admin-state enable
set / network-instance default protocols bgp group wan afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group wan import-policy ["accept-all"]
set / network-instance default protocols bgp group wan export-policy ["transit-bgp"]
set / network-instance default protocols bgp group wan timers connect-retry 5
set / network-instance default protocols bgp neighbor 172.16.2.0 peer-group wan
set / network-instance default protocols bgp neighbor 172.16.2.0 peer-as 65010
set / network-instance default protocols bgp neighbor 172.16.4.0 peer-group wan
set / network-instance default protocols bgp neighbor 172.16.4.0 peer-as 65030
set / network-instance default protocols bgp neighbor 172.16.5.0 peer-group wan
set / network-instance default protocols bgp neighbor 172.16.5.0 peer-as 65021

set / system aaa authentication user stcli password NokiaSrl1!
set / system aaa authentication user stcli superuser true
set / system aaa authentication user stcli ssh-key ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+ ac6-workshop-lab (shared, lab-only key, not a secret)"]
