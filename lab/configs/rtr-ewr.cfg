hostname rtr-ewr
!
username stcli privilege 15 role network-admin secret admin
username stcli ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+
aaa authorization exec default local
!
management api http-commands
   no shutdown
!
management ssh
   no shutdown
!
ip routing
!
interface Loopback0
   ip address 10.20.0.2/32
!
interface Ethernet1
   no switchport
   mtu 1500
   ip address 172.16.2.1/31
!
interface Ethernet2
   no switchport
   mtu 1500
   ip address 172.16.4.1/31
!
interface Ethernet3
   no switchport
   mtu 1500
   ip address 172.16.5.1/31
!
router bgp 65022
   router-id 10.20.0.2
   neighbor 172.16.2.0 remote-as 65010
   neighbor 172.16.4.0 remote-as 65030
   neighbor 172.16.5.0 remote-as 65021
   address-family ipv4
      neighbor 172.16.2.0 activate
      neighbor 172.16.4.0 activate
      neighbor 172.16.5.0 activate
!
end
