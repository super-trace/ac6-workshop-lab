hostname sw-iad
!
! Shared disposable-lab account.
username stcli privilege 15 role network-admin secret admin
username stcli ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+
aaa authorization exec default local
!
management api http-commands
   no shutdown
!
management ssh
   no shutdown
!
ip routing
!
interface Loopback0
   description LOOPBACK: router-id 10.30.0.1
   ip address 10.30.0.1/32
!
interface Ethernet1
   description ACCESS: client-iad eth1 [192.168.31.0/24 gateway]
   no switchport
   mtu 1500
   ip address 192.168.31.1/24
!
interface Ethernet3
   description WAN: rtr-phl Et2 [eBGP AS65021]
   no switchport
   mtu 1500
   ip address 172.16.3.0/31
!
interface Ethernet4
   description WAN: rtr-ewr e1-2 [eBGP AS65022]
   no switchport
   mtu 1500
   ip address 172.16.4.0/31
!
ip prefix-list SITE-PREFIXES seq 10 permit 10.30.0.1/32
ip prefix-list SITE-PREFIXES seq 20 permit 192.168.31.0/24
!
route-map ADVERTISE-SITE permit 10
   match ip address prefix-list SITE-PREFIXES
!
router bgp 65030
   router-id 10.30.0.1
   neighbor 172.16.3.1 remote-as 65021
   neighbor 172.16.3.1 route-map ADVERTISE-SITE out
   neighbor 172.16.4.1 remote-as 65022
   neighbor 172.16.4.1 route-map ADVERTISE-SITE out
   address-family ipv4
      neighbor 172.16.3.1 activate
      neighbor 172.16.4.1 activate
      network 10.30.0.1/32
      network 192.168.31.0/24
!
end
