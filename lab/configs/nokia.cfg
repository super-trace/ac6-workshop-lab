set / system aaa authentication user oldprotocol password newbrain
set / system aaa authentication user oldprotocol superuser true
set / system aaa authentication user oldprotocol ssh-key ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+ ac6-workshop-lab (shared, lab-only key, not a secret)"]
set / system aaa authentication admin-user password newbrain
set / system aaa authentication linuxadmin-user password newbrain

set / system lldp admin-state disable

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "BGP: eBGP peer AS65002"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.0.0/31

set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "TRUNK: to peer switch"
set / interface ethernet-1/2 vlan-tagging true
set / interface ethernet-1/2 subinterface 110 description "VLAN 110 DATA gateway"
set / interface ethernet-1/2 subinterface 110 vlan encap single-tagged vlan-id 110
set / interface ethernet-1/2 subinterface 110 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 110 ipv4 address 10.110.0.1/24
set / interface ethernet-1/2 subinterface 120 description "VLAN 120 VOICE gateway"
set / interface ethernet-1/2 subinterface 120 vlan encap single-tagged vlan-id 120
set / interface ethernet-1/2 subinterface 120 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 120 ipv4 address 10.120.0.1/24
set / interface ethernet-1/2 subinterface 130 description "VLAN 130 CAMERAS gateway"
set / interface ethernet-1/2 subinterface 130 vlan encap single-tagged vlan-id 130
set / interface ethernet-1/2 subinterface 130 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 130 ipv4 address 10.130.0.1/24

set / interface lo0 description "LOOPBACK: router-id 10.255.0.1"
set / interface lo0 subinterface 0 ipv4 admin-state enable
set / interface lo0 subinterface 0 ipv4 address 10.255.0.1/32
set / interface lo1 description "LOOPBACK: simulated site subnet 172.16.10.0/24"
set / interface lo1 subinterface 0 ipv4 admin-state enable
set / interface lo1 subinterface 0 ipv4 address 172.16.10.1/24

set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.110
set / network-instance default interface ethernet-1/2.120
set / network-instance default interface ethernet-1/2.130
set / network-instance default interface lo0.0
set / network-instance default interface lo1.0

set / routing-policy prefix-set LOCAL prefix 10.255.0.1/32 mask-length-range exact
set / routing-policy prefix-set LOCAL prefix 172.16.10.0/24 mask-length-range exact
set / routing-policy policy EXPORT-LOCAL default-action policy-result reject
set / routing-policy policy EXPORT-LOCAL statement 10 match prefix prefix-set LOCAL
set / routing-policy policy EXPORT-LOCAL statement 10 action policy-result accept
set / routing-policy policy IMPORT-ALL default-action policy-result accept

set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65001
set / network-instance default protocols bgp router-id 10.255.0.1
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group PEER peer-as 65002
set / network-instance default protocols bgp group PEER description "eBGP peer AS65002"
set / network-instance default protocols bgp group PEER export-policy [EXPORT-LOCAL]
set / network-instance default protocols bgp group PEER import-policy [IMPORT-ALL]
set / network-instance default protocols bgp neighbor 10.0.0.1 peer-group PEER
set / network-instance default protocols bgp neighbor 10.0.0.1 description "eBGP peer"
