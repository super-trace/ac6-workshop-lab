# nokia — intentionally blank: only what stcli needs to log in, plus the two
# lab ports turned on. SR Linux leaves ethernet ports admin-down by default,
# which would show both links as down; with them on, the cables are "plugged
# in" and the workshop configures everything else (addresses, BGP, VLANs).

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/2 admin-state enable

# The lab's only login, oldprotocol / newbrain. Attendees connect as
# oldprotocol@<ip> and type the password, as they would on a real device; the
# lab scripts use the same account with the shared lab key (lab/ssh_config
# offers the key only to the `nokia` alias, so connecting by IP still asks
# for the password). SR Linux's built-in admin and linuxadmin accounts get
# the same password, so no other password exists in the lab.
set / system aaa authentication user oldprotocol password newbrain
set / system aaa authentication user oldprotocol superuser true
set / system aaa authentication user oldprotocol ssh-key ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+ ac6-workshop-lab (shared, lab-only key, not a secret)"]
set / system aaa authentication admin-user password newbrain
set / system aaa authentication linuxadmin-user password newbrain
