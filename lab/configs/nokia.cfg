# nokia — the configured side of the lab. AS 65001.
#   ethernet-1/1: routed link to arista Ethernet1, eBGP to AS 65002
#   ethernet-1/2: 802.1Q trunk to arista Ethernet2, VLANs 110/120/130, each
#                 bridged into its own mac-vrf with an IRB gateway
# arista starts blank, so the BGP session sits in active/connect and the
# trunk has nobody tagging frames until the workshop configures that side.

# ------------------------------------------------------------ layer 3: BGP --
set / interface ethernet-1/1 description "BGP: to arista Ethernet1 [eBGP AS65002]"
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.0.0/31

set / interface system0 description "LOOPBACK: router-id 10.255.0.1"
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.255.0.1/32

# A stand-in for a site LAN, so there is a real prefix to advertise.
set / interface lo0 description "LAN: simulated site subnet"
set / interface lo0 admin-state enable
set / interface lo0 subinterface 0 admin-state enable
set / interface lo0 subinterface 0 ipv4 admin-state enable
set / interface lo0 subinterface 0 ipv4 address 172.16.10.1/24

# ------------------------------------------------------- layer 2: trunk --
set / interface ethernet-1/2 description "TRUNK: to arista Ethernet2"
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 vlan-tagging true
set / interface ethernet-1/2 subinterface 110 description "VLAN 110 DATA"
set / interface ethernet-1/2 subinterface 110 type bridged
set / interface ethernet-1/2 subinterface 110 admin-state enable
set / interface ethernet-1/2 subinterface 110 vlan encap single-tagged vlan-id 110
set / interface ethernet-1/2 subinterface 120 description "VLAN 120 VOICE"
set / interface ethernet-1/2 subinterface 120 type bridged
set / interface ethernet-1/2 subinterface 120 admin-state enable
set / interface ethernet-1/2 subinterface 120 vlan encap single-tagged vlan-id 120
set / interface ethernet-1/2 subinterface 130 description "VLAN 130 CAMERAS"
set / interface ethernet-1/2 subinterface 130 type bridged
set / interface ethernet-1/2 subinterface 130 admin-state enable
set / interface ethernet-1/2 subinterface 130 vlan encap single-tagged vlan-id 130

set / interface irb0 description "IRB: gateways for VLANs 110/120/130"
set / interface irb0 admin-state enable
set / interface irb0 subinterface 110 description "VLAN 110 DATA gateway"
set / interface irb0 subinterface 110 admin-state enable
set / interface irb0 subinterface 110 ipv4 admin-state enable
set / interface irb0 subinterface 110 ipv4 address 10.110.0.1/24
set / interface irb0 subinterface 120 description "VLAN 120 VOICE gateway"
set / interface irb0 subinterface 120 admin-state enable
set / interface irb0 subinterface 120 ipv4 admin-state enable
set / interface irb0 subinterface 120 ipv4 address 10.120.0.1/24
set / interface irb0 subinterface 130 description "VLAN 130 CAMERAS gateway"
set / interface irb0 subinterface 130 admin-state enable
set / interface irb0 subinterface 130 ipv4 admin-state enable
set / interface irb0 subinterface 130 ipv4 address 10.130.0.1/24

# ------------------------------------------------------ network instances --
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface system0.0
set / network-instance default interface lo0.0
set / network-instance default interface irb0.110
set / network-instance default interface irb0.120
set / network-instance default interface irb0.130

set / network-instance vlan110 type mac-vrf
set / network-instance vlan110 admin-state enable
set / network-instance vlan110 description "VLAN 110 DATA"
set / network-instance vlan110 interface ethernet-1/2.110
set / network-instance vlan110 interface irb0.110
set / network-instance vlan120 type mac-vrf
set / network-instance vlan120 admin-state enable
set / network-instance vlan120 description "VLAN 120 VOICE"
set / network-instance vlan120 interface ethernet-1/2.120
set / network-instance vlan120 interface irb0.120
set / network-instance vlan130 type mac-vrf
set / network-instance vlan130 admin-state enable
set / network-instance vlan130 description "VLAN 130 CAMERAS"
set / network-instance vlan130 interface ethernet-1/2.130
set / network-instance vlan130 interface irb0.130

# ------------------------------------------------------------------- BGP --
set / routing-policy prefix-set advertised prefix 10.255.0.1/32 mask-length-range exact
set / routing-policy prefix-set advertised prefix 172.16.10.0/24 mask-length-range exact
set / routing-policy policy advertise-local statement 10 match prefix prefix-set advertised
set / routing-policy policy advertise-local statement 10 action policy-result accept
# SR Linux rejects every received eBGP route unless an import-policy accepts it.
set / routing-policy policy accept-all default-action policy-result accept

set / network-instance default protocols bgp autonomous-system 65001
set / network-instance default protocols bgp router-id 10.255.0.1
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group arista admin-state enable
set / network-instance default protocols bgp group arista description "eBGP to arista"
set / network-instance default protocols bgp group arista afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group arista export-policy ["advertise-local"]
set / network-instance default protocols bgp group arista import-policy ["accept-all"]
# Default connect-retry is 120s; 5s brings the session up moments after the
# arista side is configured.
set / network-instance default protocols bgp group arista timers connect-retry 5
set / network-instance default protocols bgp neighbor 10.0.0.1 peer-group arista
set / network-instance default protocols bgp neighbor 10.0.0.1 peer-as 65002
set / network-instance default protocols bgp neighbor 10.0.0.1 description "arista Ethernet1"

# ------------------------------------------------------------- local users --
# stcli logs in as its own superuser with the shared lab key: `admin` is a
# reserved system username on SR Linux and can't take an ssh-key.
# admin/NokiaSrl1! remains for interactive use.
set / system aaa authentication user stcli password NokiaSrl1!
set / system aaa authentication user stcli superuser true
set / system aaa authentication user stcli ssh-key ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+ ac6-workshop-lab (shared, lab-only key, not a secret)"]
