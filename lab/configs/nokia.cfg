# nokia — intentionally blank: only what stcli needs to log in, plus the two
# lab ports turned on. SR Linux leaves ethernet ports admin-down by default,
# which would show both links as down; with them on, the cables are "plugged
# in" and the workshop configures everything else (addresses, BGP, VLANs).

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/2 admin-state enable

# stcli logs in as its own superuser with the shared lab key: `admin` is a
# reserved system username on SR Linux and can't take an ssh-key.
# admin/NokiaSrl1! remains for interactive use.
set / system aaa authentication user stcli password NokiaSrl1!
set / system aaa authentication user stcli superuser true
set / system aaa authentication user stcli ssh-key ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+ ac6-workshop-lab (shared, lab-only key, not a secret)"]
