frr version 8.4_git
frr defaults traditional
hostname rtr-phl
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.20.0.1/32
!
interface eth1
 ip address 172.16.1.1/31
!
interface eth2
 ip address 172.16.3.1/31
!
interface eth3
 ip address 172.16.5.0/31
!
router bgp 65021
 bgp router-id 10.20.0.1
 no bgp ebgp-requires-policy
 neighbor 172.16.1.0 remote-as 65010
 neighbor 172.16.1.0 timers connect 5
 neighbor 172.16.3.0 remote-as 65030
 neighbor 172.16.3.0 timers connect 5
 neighbor 172.16.5.1 remote-as 65022
 neighbor 172.16.5.1 timers connect 5
 !
 address-family ipv4 unicast
  neighbor 172.16.1.0 activate
  neighbor 172.16.3.0 activate
  neighbor 172.16.5.1 activate
 exit-address-family
!
line vty
!
end
