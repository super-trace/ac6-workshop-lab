hostname rtr-phl
!
username stcli privilege 15 role network-admin secret admin
username stcli ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILX/dcp2KWb01FKKtKR3V5MSFAURSWp8v1cf5UXCKYY+
aaa authorization exec default local
!
management api http-commands
   no shutdown
!
management ssh
   no shutdown
!
ip routing
!
interface Loopback0
   ip address 10.20.0.1/32
!
interface Ethernet1
   no switchport
   mtu 1500
   ip address 172.16.1.1/31
!
interface Ethernet2
   no switchport
   mtu 1500
   ip address 172.16.3.1/31
!
interface Ethernet3
   no switchport
   mtu 1500
   ip address 172.16.5.0/31
!
router bgp 65021
   router-id 10.20.0.1
   neighbor 172.16.1.0 remote-as 65010
   neighbor 172.16.3.0 remote-as 65030
   neighbor 172.16.5.1 remote-as 65022
   address-family ipv4
      neighbor 172.16.1.0 activate
      neighbor 172.16.3.0 activate
      neighbor 172.16.5.1 activate
!
end
