# leaf-jfk — JFK site's only leaf, OSPF to spine-jfk, customer-style LAN
# to client-jfk. The leaf-jfk<->spine-jfk link is where Scenario 3 (OSPF
# stuck at Two-Way) lives.

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.10.1.1/31

set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 192.168.11.1/24

set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.10.0.11/32

set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface system0.0

set / network-instance default protocols ospf instance main version ospf-v2
set / network-instance default protocols ospf instance main admin-state enable
set / network-instance default protocols ospf instance main router-id 10.10.0.11
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/1.0 admin-state enable
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/1.0 interface-type point-to-point
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/2.0 admin-state enable
set / network-instance default protocols ospf instance main area 0.0.0.0 interface ethernet-1/2.0 interface-type point-to-point
set / network-instance default protocols ospf instance main area 0.0.0.0 interface system0.0 admin-state enable
set / network-instance default protocols ospf instance main area 0.0.0.0 interface system0.0 passive true

# iBGP to spine-jfk, loopback-to-loopback over the OSPF underlay above.
# This is how the leaf learns remote-site subnets — spine-jfk redistributes
# what it learns from the WAN routers' eBGP sessions into this iBGP
# session, rewriting next-hop to itself (next-hop-self, set on the spine's
# side) along the way.
set / network-instance default protocols bgp autonomous-system 65010
set / network-instance default protocols bgp router-id 10.10.0.11
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / routing-policy policy accept-all default-action policy-result accept
set / network-instance default protocols bgp group spine admin-state enable
set / network-instance default protocols bgp group spine afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group spine import-policy ["accept-all"]
set / network-instance default protocols bgp group spine transport local-address 10.10.0.11
set / network-instance default protocols bgp neighbor 10.10.0.1 peer-group spine
set / network-instance default protocols bgp neighbor 10.10.0.1 peer-as 65010
