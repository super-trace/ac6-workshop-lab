name: ac6-workshop

# Own mgmt network/subnet so a per-attendee lab doesn't collide with the
# other labs in this org (3node-lab uses stcli3/172.20.22.0/24, the AutoCon
# demo lab uses clab/172.20.20.0/24).
mgmt:
  network: ac6
  ipv4-subnet: 172.20.23.0/24

topology:
  nodes:
    # ---------------------------------------------------------------- JFK --
    sw-jfk:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.3.2
      startup-config: configs/sw-jfk.cfg
      ports: ["2401:22"]
      labels: { graph-level: 1, graph-icon: router }
    client-jfk:
      kind: linux
      image: client-ssh:latest
      ports: ["2402:22"]
      labels: { graph-level: 2, graph-icon: host }
      binds:
        - ac6-workshop-key.pub:/tmp/ac6-workshop-key.pub:ro
      exec:
        - ip address add 192.168.11.10/24 dev eth1
        - 'ip link set eth1 alias "UPLINK: sw-jfk e1-1"'
        - ip route replace default via 192.168.11.1 dev eth1
        # No MTU baseline here — this is the mtu scenario's target, see
        # scripts/fix-mtu.sh for the healthy-state 1500 this normally runs
        # once at lab-up.

    # ---------------------------------------------------------------- IAD --
    sw-iad:
      kind: arista_ceos
      image: ghcr.io/super-trace/ac6-workshop-lab/ceos:4.36.2F
      startup-config: configs/sw-iad.cfg
      ports: ["2403:22"]
      labels: { graph-level: 1, graph-icon: router }
    client-iad:
      kind: linux
      image: client-ssh:latest
      ports: ["2404:22"]
      labels: { graph-level: 2, graph-icon: host }
      binds:
        - ac6-workshop-key.pub:/tmp/ac6-workshop-key.pub:ro
      exec:
        - ip address add 192.168.31.10/24 dev eth1
        - 'ip link set eth1 alias "UPLINK: sw-iad Et1"'
        - ip route replace default via 192.168.31.1 dev eth1
        - ip link set eth1 mtu 1500

    # ------------------------------------------------------------ WAN core --
    # Two independent paths between the sites (rtr-phl, rtr-ewr) plus a
    # direct link between them for a third form of resilience. eBGP
    # everywhere here, distinct AS per router.
    rtr-phl:
      kind: arista_ceos
      image: ghcr.io/super-trace/ac6-workshop-lab/ceos:4.36.2F
      startup-config: configs/rtr-phl.cfg
      ports: ["2405:22"]
      labels: { graph-level: 0, graph-icon: router }
    rtr-ewr:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.3.2
      startup-config: configs/rtr-ewr.cfg
      ports: ["2406:22"]
      labels: { graph-level: 0, graph-icon: router }

  links:
    # Site access: each client's gateway is its site switch
    - endpoints: ["sw-jfk:e1-1", "client-jfk:eth1"]      # 192.168.11.0/24 — bgp and mtu scenarios
    - endpoints: ["sw-iad:eth1", "client-iad:eth1"]      # 192.168.31.0/24

    # WAN — 2 paths between sites + 1 direct link between the WAN routers
    - endpoints: ["sw-jfk:e1-3", "rtr-phl:eth1"]         # eBGP, 172.16.1.0/31 — wan scenario
    - endpoints: ["sw-jfk:e1-4", "rtr-ewr:e1-1"]         # eBGP, 172.16.2.0/31
    - endpoints: ["sw-iad:eth3", "rtr-phl:eth2"]         # eBGP, 172.16.3.0/31 — path scenario
    - endpoints: ["sw-iad:eth4", "rtr-ewr:e1-2"]         # eBGP, 172.16.4.0/31
    - endpoints: ["rtr-phl:eth3", "rtr-ewr:e1-3"]        # eBGP, 172.16.5.0/31
