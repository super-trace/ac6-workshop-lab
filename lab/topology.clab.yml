name: ac6-workshop

# Own mgmt network/subnet so a per-attendee lab doesn't collide with the
# other labs in this org (3node-lab uses stcli3/172.20.22.0/24, the AutoCon
# demo lab uses clab/172.20.20.0/24).
mgmt:
  network: ac6
  ipv4-subnet: 172.20.23.0/24

# Two devices, two links:
#   nokia (SR Linux) is fully configured: BGP toward arista on e1-1, an
#   802.1Q trunk with three VLANs on e1-2.
#   arista (cEOS) starts blank apart from SSH access; the workshop
#   configures both of its links.
topology:
  nodes:
    nokia:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.3.2
      startup-config: configs/nokia.cfg
      mgmt-ipv4: 172.20.23.2   # fixed, so the README can say "connect 172.20.23.2"
      ports: ["2401:22"]
      labels: { graph-level: 0, graph-icon: router }
    arista:
      kind: arista_ceos
      image: ghcr.io/super-trace/ac6-workshop-lab/ceos:4.36.2F
      startup-config: configs/arista.cfg
      mgmt-ipv4: 172.20.23.3
      ports: ["2402:22"]
      labels: { graph-level: 0, graph-icon: switch }
      # EOS finds iptables-restore on PATH, where /usr/local/sbin comes first.
      # The shim drops conntrack-helper rules that Docker Desktop's kernel
      # can't load; without it SSH to arista never answers. See the script.
      binds:
        - images/ceos-shim/iptables-restore:/usr/local/sbin/iptables-restore:ro
        - images/ceos-shim/iptables-restore:/usr/local/sbin/ip6tables-restore:ro

  links:
    - endpoints: ["nokia:e1-1", "arista:eth1"]   # layer 3: eBGP, 10.0.0.0/31
    - endpoints: ["nokia:e1-2", "arista:eth2"]   # layer 2: 802.1Q trunk
