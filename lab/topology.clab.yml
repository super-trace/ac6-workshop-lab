name: ac6-workshop

# Own mgmt network/subnet so a per-attendee lab doesn't collide with the
# other labs in this org (3node-lab uses stcli3/172.20.22.0/24, the AutoCon
# demo lab uses clab/172.20.20.0/24).
mgmt:
  network: ac6
  ipv4-subnet: 172.20.23.0/24

topology:
  nodes:
    # ---------------------------------------------------------------- JFK --
    spine-jfk:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.3.2
      startup-config: configs/spine-jfk.cfg
      ports: ["2401:22"]
      labels: { graph-level: 1, graph-icon: router }
    leaf-jfk:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.3.2
      startup-config: configs/leaf-jfk.cfg
      ports: ["2402:22"]
      labels: { graph-level: 2, graph-icon: router }
    client-jfk:
      kind: linux
      image: client-ssh:latest
      ports: ["2403:22"]
      labels: { graph-level: 3, graph-icon: host }
      binds:
        - ac6-workshop-key.pub:/root/.ssh/authorized_keys:ro
      exec:
        - ip address add 192.168.11.10/24 dev eth1
        - ip route replace default via 192.168.11.1 dev eth1
        # No MTU baseline here — this is Scenario 2's target, see
        # scripts/fix-mtu.sh for the healthy-state 1500 this normally runs
        # once at lab-up.

    # ---------------------------------------------------------------- IAD --
    spine-iad:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.3.2
      startup-config: configs/spine-iad.cfg
      ports: ["2404:22"]
      labels: { graph-level: 1, graph-icon: router }
    leaf-iad:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.3.2
      startup-config: configs/leaf-iad.cfg
      ports: ["2405:22"]
      labels: { graph-level: 2, graph-icon: router }
    client-iad:
      kind: linux
      image: client-ssh:latest
      ports: ["2406:22"]
      labels: { graph-level: 3, graph-icon: host }
      binds:
        - ac6-workshop-key.pub:/root/.ssh/authorized_keys:ro
      exec:
        - ip address add 192.168.31.10/24 dev eth1
        - ip route replace default via 192.168.31.1 dev eth1
        - ip link set eth1 mtu 1500

    # ------------------------------------------------------------ WAN core --
    # Two independent paths between the sites (rtr-phl, rtr-ewr) plus a
    # direct link between them for a third form of resilience. eBGP
    # everywhere here, distinct AS per router — see README's "Why eBGP,
    # not an iBGP mesh" for the design rationale (RFC 7938 + real DCI
    # practice).
    rtr-phl:
      kind: linux
      image: frr-ssh:latest
      ports: ["2407:22"]
      labels: { graph-level: 0, graph-icon: switch }
      binds:
        - configs/rtr-phl-daemons:/etc/frr/daemons
        - configs/rtr-phl-frr.conf:/etc/frr/frr.conf
        - ac6-workshop-key.pub:/root/.ssh/authorized_keys:ro
    rtr-ewr:
      kind: linux
      image: frr-ssh:latest
      ports: ["2408:22"]
      labels: { graph-level: 0, graph-icon: switch }
      binds:
        - configs/rtr-ewr-daemons:/etc/frr/daemons
        - configs/rtr-ewr-frr.conf:/etc/frr/frr.conf
        - ac6-workshop-key.pub:/root/.ssh/authorized_keys:ro

  links:
    # JFK fabric
    - endpoints: ["spine-jfk:e1-1", "leaf-jfk:e1-1"]     # OSPF, 10.10.1.0/31 — Scenario 3
    - endpoints: ["leaf-jfk:e1-2", "client-jfk:eth1"]    # 192.168.11.0/24 — Scenarios 1 & 2

    # IAD fabric
    - endpoints: ["spine-iad:e1-1", "leaf-iad:e1-1"]     # OSPF, 10.30.1.0/31
    - endpoints: ["leaf-iad:e1-2", "client-iad:eth1"]    # 192.168.31.0/24

    # WAN — 2 paths between sites + 1 direct link between the WAN routers
    - endpoints: ["spine-jfk:e1-3", "rtr-phl:eth1"]      # eBGP, 172.16.1.0/31 — Scenario 4
    - endpoints: ["spine-jfk:e1-4", "rtr-ewr:eth1"]      # eBGP, 172.16.2.0/31
    - endpoints: ["spine-iad:e1-3", "rtr-phl:eth2"]      # eBGP, 172.16.3.0/31
    - endpoints: ["spine-iad:e1-4", "rtr-ewr:eth2"]      # eBGP, 172.16.4.0/31
    - endpoints: ["rtr-phl:eth3", "rtr-ewr:eth3"]        # eBGP, 172.16.5.0/31
